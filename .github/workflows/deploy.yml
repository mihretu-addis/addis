# Production deploy only — push to main.
# Nginx proxies host port 3030 → container 3000.
#
# Required repository secrets:
#   SSH_HOST, SSH_USERNAME, SSH_KEY
#
# Optional repository secrets:
#   SSH_PORT         (default: 22)
#   PROJECT_FOLDER   (default: /opt/addis-tach-web)
#
# Optional repo variables (build-time):
#   NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_API_URL

name: Deploy Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_PORT: '3030'
  DEFAULT_PROJECT_FOLDER: /opt/addis-tach-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image repository
        run: |
          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO=ghcr.io/${repo_lower}" >> "${GITHUB_ENV}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          provenance: false
          sbom: false
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://addistech.com' }}
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Set deploy variables
        run: |
          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "APP_IMAGE=ghcr.io/${repo_lower}:${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "GHCR_USER=${{ github.actor }}" >> "${GITHUB_ENV}"
          echo "PROJECT_DIR=${{ secrets.PROJECT_FOLDER || env.DEFAULT_PROJECT_FOLDER }}" >> "${GITHUB_ENV}"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT || '22' }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.PROJECT_FOLDER || env.DEFAULT_PROJECT_FOLDER }}/

      - name: Deploy container
        uses: appleboy/ssh-action@v1.2.4
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT || '22' }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,APP_PORT
          script: |
            set -euo pipefail
            FOLDER="${{ secrets.PROJECT_FOLDER || env.DEFAULT_PROJECT_FOLDER }}"
            mkdir -p "${FOLDER}"
            cd "${FOLDER}"

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker pull "${APP_IMAGE}"

            if [ -f .env ] && grep -q '^APP_IMAGE=' .env; then
              sed -i.bak "s|^APP_IMAGE=.*|APP_IMAGE=${APP_IMAGE}|" .env
            else
              echo "APP_IMAGE=${APP_IMAGE}" >> .env
            fi
            if grep -q '^APP_PORT=' .env 2>/dev/null; then
              sed -i.bak "s|^APP_PORT=.*|APP_PORT=${APP_PORT}|" .env
            else
              echo "APP_PORT=${APP_PORT}" >> .env
            fi

            export APP_IMAGE APP_PORT
            docker compose up -d --pull always --force-recreate
            docker image prune -f
            echo "Deployed ${APP_IMAGE} on port ${APP_PORT}"
