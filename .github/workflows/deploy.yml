# Production deploy only — push to main.
# Nginx proxies host port 3030 → container 3000.
#
# Required repo secret (base64 shell file):
#   WEBSITE_PROD_DEPLOY_BASE64
#
# Bundle must include:
#   SSH_HOST, SSH_USERNAME, SSH_PORT, SSH_KEY, PROJECT_FOLDER
#   GHCR_TOKEN  (PAT with read:packages — used on the VPS to pull the image)
#   GHCR_USER   (GitHub username that owns the token; optional, defaults to repo owner)
#
# Optional repo variables (build-time):
#   NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_API_URL

name: Deploy Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_PORT: '3030'
  DEFAULT_PROJECT_FOLDER: /opt/addis-tach-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE_REPO }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image repository
        run: |
          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPO=ghcr.io/${repo_lower}" >> "${GITHUB_ENV}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          provenance: false
          sbom: false
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Load deploy credentials
        env:
          CREDS_B64: ${{ secrets.WEBSITE_PROD_DEPLOY_BASE64 }}
        run: |
          if [ -z "${CREDS_B64}" ]; then
            echo "::error::Missing secret WEBSITE_PROD_DEPLOY_BASE64" >&2
            exit 1
          fi
          printf '%s\n' "${CREDS_B64}" | base64 -d > .secrets.env
          set -a
          # shellcheck disable=SC1091
          source .secrets.env
          set +a
          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "::error::GHCR_TOKEN must be inside WEBSITE_PROD_DEPLOY_BASE64 (PAT with read:packages)" >&2
            exit 1
          fi
          PROJECT_FOLDER="${PROJECT_FOLDER:-${{ env.DEFAULT_PROJECT_FOLDER }}}"
          GHCR_USER="${GHCR_USER:-${{ github.repository_owner }}}"
          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "SSH_HOST=${SSH_HOST}"
            echo "SSH_USERNAME=${SSH_USERNAME}"
            echo "SSH_PORT=${SSH_PORT:-22}"
            echo "PROJECT_FOLDER=${PROJECT_FOLDER}"
            echo "GHCR_USER=${GHCR_USER}"
            echo "APP_IMAGE=ghcr.io/${repo_lower}:${GITHUB_SHA}"
          } >> "${GITHUB_ENV}"
          {
            echo "SSH_KEY<<EOF"
            echo "${SSH_KEY}"
            echo "EOF"
            echo "GHCR_TOKEN<<EOF"
            echo "${GHCR_TOKEN}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          port: ${{ env.SSH_PORT }}
          key: ${{ env.SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.PROJECT_FOLDER }}/

      - name: Deploy container
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          port: ${{ env.SSH_PORT }}
          key: ${{ env.SSH_KEY }}
          command_timeout: 10m
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,APP_PORT
          script: |
            set -euo pipefail
            FOLDER="${{ env.PROJECT_FOLDER }}"
            mkdir -p "${FOLDER}"
            cd "${FOLDER}"

            # Non-interactive GHCR login (empty token causes "Cannot perform an interactive login")
            if [ -z "${GHCR_TOKEN}" ]; then
              echo "GHCR_TOKEN is empty" >&2
              exit 1
            fi
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            docker pull "${APP_IMAGE}"

            if [ -f .env ] && grep -q '^APP_IMAGE=' .env; then
              sed -i.bak "s|^APP_IMAGE=.*|APP_IMAGE=${APP_IMAGE}|" .env
            else
              echo "APP_IMAGE=${APP_IMAGE}" >> .env
            fi
            if grep -q '^APP_PORT=' .env 2>/dev/null; then
              sed -i.bak "s|^APP_PORT=.*|APP_PORT=${APP_PORT}|" .env
            else
              echo "APP_PORT=${APP_PORT}" >> .env
            fi

            export APP_IMAGE APP_PORT
            docker compose up -d --pull always --force-recreate

            docker image prune -f
            echo "Deployed ${APP_IMAGE} on port ${APP_PORT}"

      - name: Cleanup
        if: always()
        run: rm -f .secrets.env
