services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    container_name: addis-tach-web-stage
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3030}:3000"
    networks:
      - novas-network

networks:
  novas-network:
    driver: bridge
