<svg width="200" height="160" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background circle -->
    <circle cx="100" cy="80" r="70" fill="#F4F4F5" />

    <!-- Card / container -->
    <rect x="50" y="40" width="100" height="70" rx="12" fill="#FFFFFF" stroke="#E4E4E7" />

    <!-- Top bar -->
    <rect x="60" y="50" width="80" height="10" rx="5" fill="#E4E4E7" />

    <!-- Lines -->
    <rect x="60" y="65" width="60" height="6" rx="3" fill="#D4D4D8" />
    <rect x="60" y="75" width="50" height="6" rx="3" fill="#D4D4D8" />
    <rect x="60" y="85" width="40" height="6" rx="3" fill="#D4D4D8" />

    <!-- Empty icon (magnifier) -->
    <circle cx="120" cy="95" r="10" stroke="#A1A1AA" stroke-width="2" />
    <line x1="128" y1="103" x2="135" y2="110" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" />

    <!-- Small dots -->
    <circle cx="80" cy="105" r="2" fill="#A1A1AA" />
    <circle cx="90" cy="105" r="2" fill="#A1A1AA" />
    <circle cx="100" cy="105" r="2" fill="#A1A1AA" />
</svg>